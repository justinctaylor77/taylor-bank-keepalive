# Keep Taylor Bank (Render free) awake Mon–Sat 7am–7pm America/Denver.
# GitHub Actions `schedule` is best-effort and can drop/delay runs under load;
# minutes are offset from :00/:10/:20 to reduce drops (GitHub docs).
# A prior dual-UTC-cron version never produced a single `schedule` run for 3+ hours
# after create (only workflow_dispatch worked). Re-registering with one timezone
# cron + disable/enable is the documented recovery path.
name: Keep Taylor Bank awake

on:
  schedule:
    # Mon–Sat 06:07–18:57 America/Denver (warm by 7:00, last ping ~18:57)
    - cron: '7,17,27,37,47,57 6-18 * * 1-6'
      timezone: America/Denver
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taylor-bank-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz if within bank hours (America/Denver)
        run: |
          set -euo pipefail
          export TZ=America/Denver
          dow=$(date +%u)   # 1=Mon … 7=Sun
          hm=$((10#$(date +%H%M)))  # HHMM
          echo "Denver now: $(date '+%F %T %Z') dow=$dow hm=$hm event=${GITHUB_EVENT_NAME:-unknown}"

          # Mon–Sat and 06:50–18:59 inclusive (warm by 7:00, last ping ~18:57)
          if [ "$dow" -lt 1 ] || [ "$dow" -gt 6 ] || [ "$hm" -lt 650 ] || [ "$hm" -gt 1859 ]; then
            echo "Outside bank hours — skipping ping."
            exit 0
          fi

          url='https://taylor-envelopes.onrender.com/healthz'
          # Cold start on free Render can take 30–60s; allow up to 90s
          code=$(curl -sS -o /tmp/hz.body -w '%{http_code}' --max-time 90 "$url" || true)
          body=$(head -c 80 /tmp/hz.body || true)
          echo "GET $url → HTTP $code body=$body"
          if [ "$code" != "200" ]; then
            echo "Health check failed"
            exit 1
          fi
